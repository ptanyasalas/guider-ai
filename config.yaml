model:
  vocab_size: null
  block_size: 32
  n_layer: 4
  n_head: 4
  n_embd: 128
  dropout: 0.0

training:
  batch_size: 8
  learning_rate: 0.0003
  max_steps: 500
  eval_interval: 100
  eval_steps: 20
  weight_decay: 0.1
  grad_clip: 1.0
  train_split: 0.9
  seed: 42

data:
  path: data/train.txt

checkpoint:
  dir: checkpoints
  filename: guider.pt

generation:
  max_new_tokens: 300
  temperature: 0.8
  top_k: 50