model:
  vocab_size: null
  block_size: 64
  n_layer: 6
  n_head: 6
  n_embd: 192
  dropout: 0.1

tokenizer:
  vocab_size: 2048
  min_pair_frequency: 2

training:
  batch_size: 16
  learning_rate: 0.0003
  max_steps: 5000
  eval_interval: 100
  eval_steps: 20
  weight_decay: 0.1
  grad_clip: 1.0
  train_split: 0.9
  seed: 42

data:
  path: data/train.txt

checkpoint:
  dir: checkpoints
  filename: guider.pt

generation:
  max_new_tokens: 300
  temperature: 0.8
  top_k: 50