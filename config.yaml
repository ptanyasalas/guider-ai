model:
  vocab_size: null
  block_size: 256
  n_layer: 6
  n_head: 6
  n_embd: 192
  dropout: 0.15

tokenizer:
  vocab_size: 2048
  min_pair_frequency: 2
  sample_chars: 10000000
  eos_token: "<|endoftext|>"

training:
  batch_size: 32
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 200
  max_steps: 8000
  eval_interval: 100
  eval_steps: 10
  weight_decay: 0.1
  grad_clip: 1.0
  seed: 42
  amp: true
  compile: false

early_stopping:
  enabled: true
  patience: 8
  min_delta: 0.001

data:
  local_dir: data
  persistent_dir: null
  train_file: train.bin
  val_file: val.bin
  tokenizer_file: tokenizer.json
  max_train_tokens: 500000000
  max_val_tokens: 10000000
  preprocess_batch_size: 2048

checkpoint:
  local_dir: checkpoints
  drive_dir: null
  filename: guider_latest.pt
  best_filename: guider_best.pt
  save_interval: 250
  resume: true

generation:
  max_new_tokens: 300
  temperature: 0.8
  top_k: 50
